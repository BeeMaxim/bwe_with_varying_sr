_target_: src.model.HiFiGAN  
generator_config:
  hifi_resblock: "1"
  hifi_upsample_rates: [1, 16, 2, 2]
  hifi_upsample_initial_channel: 64
  hifi_resblock_kernel_sizes: [3, 7, 11]
  hifi_resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  hifi_conv_pre_kernel_size: 1

  upsample_block_rates: [2]
  upsample_block_kernel_sizes: [4]

  residual_channels: 64
  bsft_channels: 64
  nwstack1_blocks: 1
  nwstack2_blocks: 1

  use_spectralunet: False
  spectralunet_block_widths: [8, 16, 24, 32, 64]
  spectralunet_block_depth: 5
  spectralunet_positional_encoding: True

  use_waveunet: True
  waveunet_block_widths: [10, 20, 40, 80]
  waveunet_block_depth: 4

  use_spectralmasknet: True

  norm_type: "weight"
  use_skip_connect: True
  waveunet_input: "both"

  activation: "leaky_relu"

  n_fft: 256
  hop_size: 64
  win_size: 256

defaults:
  - _self_
  - discriminators@discriminators.msstft: MSSTFT
  #- discriminators@discriminators.mpd: MPD
